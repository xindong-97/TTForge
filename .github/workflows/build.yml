name: Build TTForge
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" -dynamiclib -fno-objc-arc -framework UIKit -framework Foundation -undefined dynamic_lookup -o TTForge.dylib TTForge.m
          ls -lh TTForge.dylib
          file TTForge.dylib || true
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: TTForge-dylib
          path: TTForge.dylib
          if-no-files-found: error
