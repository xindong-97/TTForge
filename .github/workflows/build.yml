name: Build TTForge Nova120
on:
  push:
    paths:
      - "TTForge.m"
      - "NovaControlPanel.m"
      - "NovaControlPanel.h"
      - "NovaFloatingButton.m"
      - "NovaFloatingButton.h"
      - "NovaUIManager.m"
      - "NovaUIManager.h"
      - ".github/workflows/build.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fno-objc-arc -fblocks -c TTForge.m -o out/TTForge.o
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -fblocks -c NovaControlPanel.m -o out/NovaControlPanel.o
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -fblocks -c NovaFloatingButton.m -o out/NovaFloatingButton.o
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -fblocks -c NovaUIManager.m -o out/NovaUIManager.o
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -dynamiclib -fblocks -o out/TTForge_NovaUI_v7.36.dylib out/TTForge.o out/NovaControlPanel.o out/NovaFloatingButton.o out/NovaUIManager.o -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework Security
          file out/TTForge_NovaUI_v7.36.dylib
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: TTForge-Nova120-dylib
          path: out/TTForge_NovaUI_v7.36.dylib
